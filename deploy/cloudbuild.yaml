# Build and test only in the dedicated F1 PitWall project.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --target, test, -t, f1-pitwall-test, .]
  - name: gcr.io/cloud-builders/docker
    args: [run, --rm, f1-pitwall-test, python, -m, pytest, -q, --basetemp=/tmp/pitwall-tests, -p, 'no:cacheprovider']
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/f1-pitwall/api:$BUILD_ID', .]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/f1-pitwall/api:$BUILD_ID'
substitutions:
  _REGION: us-central1
options:
  logging: CLOUD_LOGGING_ONLY
