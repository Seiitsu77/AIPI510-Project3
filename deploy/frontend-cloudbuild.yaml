# Docker verification only; the frontend deployment target remains Vercel.
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, 'NEXT_PUBLIC_API_URL=${_API_URL}', -t, '${_REGION}-docker.pkg.dev/$PROJECT_ID/f1-pitwall/frontend:$BUILD_ID', .]
  - name: gcr.io/cloud-builders/docker
    args: [run, --detach, --name, f1-pitwall-frontend-smoke, '${_REGION}-docker.pkg.dev/$PROJECT_ID/f1-pitwall/frontend:$BUILD_ID']
  - name: gcr.io/cloud-builders/docker
    args:
      - exec
      - f1-pitwall-frontend-smoke
      - node
      - -e
      - |
        (async()=>{for(let attempt=0;attempt<30;attempt++){try{for(const route of ['/','/pace-lab']){const response=await fetch('http://127.0.0.1:3000'+route);if(response.status!==200)throw new Error(route+' '+response.status);}console.log('Frontend Docker HTTP checks passed for both routes');return;}catch(error){if(attempt===29)throw error;await new Promise(resolve=>setTimeout(resolve,1000));}}})().catch(error=>{console.error(error);process.exit(1);});
  - name: gcr.io/cloud-builders/docker
    args: [stop, f1-pitwall-frontend-smoke]
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/f1-pitwall/frontend:$BUILD_ID'
substitutions:
  _REGION: us-central1
  _API_URL: http://localhost:8000
options:
  logging: CLOUD_LOGGING_ONLY
