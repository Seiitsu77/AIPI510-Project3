name: F1 PitWall checks
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exercise training inside Docker
        run: |
          docker build --target test -t f1-pitwall-training-test .
          docker run --rm f1-pitwall-training-test python -m pytest -q tests/test_training.py -p no:cacheprovider
      - name: Start the clean-clone Compose stack
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify the API and both frontend routes
        run: |
          python3 - <<'PY'
          import json
          from urllib.request import urlopen

          with urlopen('http://localhost:8000/health', timeout=10) as response:
              health = json.load(response)
          assert health['status'] == 'ok', health
          assert health['historical_races'] == 0 and not health['model_ready'], health
          print('Clean-clone API is healthy:', health)
          PY
          curl --fail --silent --show-error --retry 10 --retry-connrefused -o "$RUNNER_TEMP/race-control.html" http://localhost:3000/
          curl --fail --silent --show-error --retry 10 --retry-connrefused -o "$RUNNER_TEMP/pace-lab.html" http://localhost:3000/pace-lab
          grep -Fq 'Race Control' "$RUNNER_TEMP/race-control.html"
          grep -Fq 'Pace Lab' "$RUNNER_TEMP/pace-lab.html"
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the Compose stack
        if: always()
        run: docker compose down
